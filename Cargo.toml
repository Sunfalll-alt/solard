[package]
name = "solard"
version = "0.1.1"
edition = "2021"
authors = ["Arch Linux User"]
description = "Solar-aware and scheduled theme daemon for GNOME/Wayland, Kitty, Qt and Gammastep"
license = "MIT OR Apache-2.0"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
libc = "0.2"
directories = "5.0"
